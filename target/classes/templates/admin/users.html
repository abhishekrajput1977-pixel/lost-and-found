<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users – CampusGuard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i> User Directory & Access Control</h3>
            <p class="text-muted small mb-0">Manage verified student IDs, staff accounts, security officers, and access privileges.</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Control Center</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card-cg p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>College Email</th>
                        <th>Role</th>
                        <th>Student ID</th>
                        <th>Account Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${'#' + u.id}">#1</td>
                        <td><strong th:text="${u.fullName}">Name</strong></td>
                        <td th:text="${u.email}">email@college.test</td>
                        <td><span class="badge bg-secondary" th:text="${u.role}">STUDENT</span></td>
                        <td>
                            <span th:if="${u.studentProfile != null}" class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${u.studentProfile.studentId}">SRM2026CSE001</span>
                            <span th:if="${u.studentProfile == null}" class="text-muted small">N/A</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-danger'}" th:text="${u.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span>
                        </td>
                        <td>
                            <form th:action="@{'/admin/users/' + ${u.id} + '/toggle'}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm" th:classappend="${u.enabled ? 'btn-outline-danger' : 'btn-outline-success'}">
                                    <span th:text="${u.enabled ? 'Disable' : 'Enable'}">Toggle</span>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
