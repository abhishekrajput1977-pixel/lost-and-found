<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Item Detail – CampusGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-cg p-4 shadow-lg">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <div>
                        <span class="badge bg-success mb-1" th:text="${item.status}">FOUND</span>
                        <h3 class="fw-bold text-dark mb-0" th:text="${item.itemName}">Item Name</h3>
                    </div>
                    <a th:href="@{/items/search}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Search</a>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-5 text-center">
                        <img th:if="${item.photoUrl != null}" th:src="${item.photoUrl}" class="img-fluid rounded border shadow-sm object-fit-cover" style="max-height: 250px;">
                        <div th:if="${item.photoUrl == null}" class="p-5 bg-light rounded text-muted border">
                            <i class="bi bi-image fs-1 d-block"></i>
                            <small>No image uploaded</small>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <table class="table table-sm table-borderless">
                            <tr>
                                <th class="text-muted" style="width:35%;">Category:</th>
                                <td class="fw-semibold" th:text="${item.categoryName}">Electronics</td>
                            </tr>
                            <tr>
                                <th class="text-muted">Brand:</th>
                                <td class="fw-semibold" th:text="${item.brand != null ? item.brand : 'N/A'}">Nike</td>
                            </tr>
                            <tr>
                                <th class="text-muted">Color:</th>
                                <td class="fw-semibold" th:text="${item.color != null ? item.color : 'N/A'}">Black</td>
                            </tr>
                            <tr>
                                <th class="text-muted">Found Location:</th>
                                <td class="fw-semibold text-success"><i class="bi bi-geo-alt-fill me-1"></i><span th:text="${item.locationName}">Central Library</span></td>
                            </tr>
                            <tr>
                                <th class="text-muted">Found Date:</th>
                                <td class="fw-semibold" th:text="${item.foundDate}">2026-09-29</td>
                            </tr>
                            <tr>
                                <th class="text-muted">Reported By:</th>
                                <td class="fw-semibold" th:text="${item.reportedByName}">Student Finder</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="mb-4">
                    <h6 class="fw-bold border-bottom pb-2">Public Description</h6>
                    <p class="text-muted" th:text="${item.description}">Full description here...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
