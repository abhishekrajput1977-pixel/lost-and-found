<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Lost & Found – CampusGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <!-- SEARCH HEADER & FILTERS -->
    <div class="glass-card p-4 mb-4">
        <h4 class="fw-bold mb-3"><i class="bi bi-search me-2 text-primary"></i> Search Campus Belongings</h4>
        
        <form th:action="@{/items/search}" method="get" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="query" class="form-control" placeholder="Search item name, brand, description..." th:value="${filter.query}">
            </div>
            <div class="col-md-2">
                <select name="itemType" class="form-select">
                    <option value="LOST" th:selected="${filter.itemType == 'LOST' or filter.itemType == null}">Lost Reports</option>
                    <option value="FOUND" th:selected="${filter.itemType == 'FOUND'}">Found Reports</option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${filter.categoryId == cat.id}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <select name="locationId" class="form-select">
                    <option value="">All Campus Locations</option>
                    <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name}" th:selected="${filter.locationId == loc.id}"></option>
                </select>
            </div>
            <div class="col-12 text-end">
                <a th:href="@{/items/search}" class="btn btn-outline-secondary me-2">Reset Filters</a>
                <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-filter me-1"></i> Apply Filters</button>
            </div>
        </form>
    </div>

    <!-- RESULTS GRID -->
    <div th:if="${itemsPage != null and itemsPage.totalElements == 0}" class="text-center py-5 text-muted card-cg p-5">
        <i class="bi bi-search fs-1 d-block mb-3 text-secondary"></i>
        <h5>No items found matching your search criteria</h5>
        <p class="small">Try adjusting search keywords or selecting different location/category filters.</p>
    </div>

    <div th:if="${itemsPage != null and itemsPage.totalElements > 0}" class="row g-4">
        <div th:each="item : ${itemsPage.content}" class="col-md-4">
            <div class="card-cg h-100 p-0 overflow-hidden d-flex flex-column">
                <div class="position-relative bg-light text-center py-3 border-bottom" style="height: 180px;">
                    <img th:if="${item.photoUrl != null and !item.photoUrl.isBlank()}" 
                         th:src="${item.photoUrl}" 
                         class="w-100 h-100 object-fit-cover"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="d-flex align-items-center justify-content-center h-100 text-muted"
                         th:style="${item.photoUrl != null and !item.photoUrl.isBlank() ? 'display:none;' : 'display:flex;'}">
                        <i class="bi bi-box-seam fs-1 text-primary"></i>
                    </div>
                    <span class="position-absolute top-0 start-0 m-3 badge"
                          th:classappend="${filter.itemType == 'FOUND' ? 'bg-success' : 'bg-warning text-dark'}"
                          th:text="${item.status}">LOST</span>
                </div>
                <div class="p-4 flex-grow-1 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="badge bg-secondary-subtle text-secondary small" th:text="${item.categoryName}">Electronics</span>
                            <small class="text-muted" th:text="${item.lostDate != null ? item.lostDate : item.foundDate}">Date</small>
                        </div>
                        <h5 class="fw-bold text-dark mb-2" th:text="${item.itemName}">Item Name</h5>
                        <p class="text-muted small mb-3 text-truncate" th:text="${item.description}">Item Description...</p>
                    </div>
                    <div class="border-top pt-3 mt-2 d-flex justify-content-between align-items-center">
                        <small class="text-muted"><i class="bi bi-geo-alt-fill text-danger me-1"></i><span th:text="${item.locationName}">Location</span></small>
                        <a th:if="${filter.itemType == 'FOUND'}" th:href="@{'/items/found/' + ${item.id}}" class="btn btn-sm btn-outline-primary fw-semibold">View Detail</a>
                        <a th:if="${filter.itemType != 'FOUND'}" th:href="@{'/items/lost/' + ${item.id}}" class="btn btn-sm btn-outline-primary fw-semibold">View Detail</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
