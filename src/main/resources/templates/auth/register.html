<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration – CampusGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 my-3">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="glass-card shadow-lg">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Student Registration</h3>
                    <p class="text-muted small">Register with your official college credentials</p>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/api/auth/register}" method="post" id="registerForm">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name *</label>
                            <input type="text" name="fullName" class="form-control" placeholder="Rahul Sharma" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">College Email *</label>
                            <input type="email" name="email" class="form-control" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Student ID * (e.g. SRM2026CSE001)</label>
                            <input type="text" name="studentId" class="form-control" placeholder="SRM2026CSE001" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Department *</label>
                            <select name="departmentId" class="form-select" required>
                                <option value="">Select Department</option>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Year *</label>
                            <select name="year" class="form-select" required>
                                <option value="1st Year">1st Year</option>
                                <option value="2nd Year">2nd Year</option>
                                <option value="3rd Year">3rd Year</option>
                                <option value="4th Year">4th Year</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Section</label>
                            <input type="text" name="section" class="form-control" placeholder="A">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="text" name="phoneNumber" class="form-control" placeholder="+91 9876543210">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <input type="hidden" name="role" value="STUDENT">

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
                        <i class="bi bi-person-check-fill me-2"></i> Complete Registration
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <span class="text-muted small">Already have an account?</span>
                    <a th:href="@{/login}" class="fw-bold text-decoration-none ms-1">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const object = {};
        formData.forEach((value, key) => object[key] = value);

        fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(object)
        })
        .then(res => {
            if (res.ok) {
                window.location.href = "/login?success=registered";
            } else {
                return res.json().then(err => { throw new Error(err.message || "Registration failed"); });
            }
        })
        .catch(err => alert(err.message));
    });
</script>
</body>
</html>
