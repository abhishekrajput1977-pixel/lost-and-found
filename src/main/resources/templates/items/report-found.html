<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item – CampusGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card shadow-lg">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center" style="width:50px; height:50px;">
                        <i class="bi bi-box-seam fs-3"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Report Found Item</h3>
                        <p class="text-muted small mb-0">Report belongings found on campus so owners can be identified</p>
                    </div>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <form th:action="@{/items/report-found}" method="post" enctype="multipart/form-data">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Item Name *</label>
                            <input type="text" name="itemName" class="form-control" placeholder="e.g. Black Backpack, iPhone, Keys" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Category *</label>
                            <select name="categoryId" class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Brand / Manufacturer</label>
                            <input type="text" name="brand" class="form-control" placeholder="e.g. Nike, Apple, Sony">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Color</label>
                            <input type="text" name="color" class="form-control" placeholder="e.g. Black, Blue, Silver">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Public Item Description *</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="General description of the found item..." required></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Found Location *</label>
                            <select name="locationId" class="form-select" required>
                                <option value="">Select Campus Location</option>
                                <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name + ' (' + loc.building + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Found Date *</label>
                            <input type="date" name="foundDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Approx. Time</label>
                            <input type="time" name="foundTime" class="form-control">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Item Photograph (Optional)</label>
                            <input type="file" name="file" class="form-control" accept="image/*">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Condition Status</label>
                            <input type="text" name="conditionStatus" class="form-control" placeholder="e.g. Good, Scratched, Working">
                        </div>
                    </div>

                    <div class="private-info-box mb-4">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <i class="bi bi-shield-lock-fill text-success fs-5"></i>
                            <h6 class="fw-bold text-dark mb-0">Private Finder Details (Confidential)</h6>
                        </div>
                        <p class="small text-muted mb-2">
                            Specific confidential details noticed about the item (e.g. contents inside bag, security counter deposit details).
                        </p>
                        <textarea name="privateDetails" class="form-control" rows="2" placeholder="e.g. Deposited at Central Library main desk with Security Guard..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-success px-5 fw-bold">
                            <i class="bi bi-check-circle-fill me-2"></i> Submit Found Report
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
